name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit and integration tests (all features)
        run: cargo test --all-targets --all-features --verbose

      - name: Run unit and integration tests (no default features)
        run: cargo test --no-default-features --verbose

      - name: Run headless simulation example
        run: cargo run --example headless_simulation

      - name: Run Rapier3D physics example
        run: cargo run --example rapier_ragdoll --features rapier3d
